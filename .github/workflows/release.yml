# Gera o zip do plugin e anexa a uma Release quando uma tag "v*" é criada.
# Fluxo: git tag v0.1.0 && git push --tags  →  release com o zip pronto.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build + package
        run: npm run package

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-zip/*.zip
          generate_release_notes: true
